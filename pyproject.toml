[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlcd"
version = "0.1.0"
description = "Lightweight, non-autoregressive decision engine for structured workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "gliclass>=0.1.0",
    "safetensors>=0.4.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.18.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "accelerate>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "rlcd*", "openjev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["oss", "files-not-tobe-commited", ".venv", "node_modules"]

